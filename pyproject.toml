[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nr-sync"
version = "0.1.0"
description = "5G NR synchronization simulation modules"
requires-python = ">=3.10"
dependencies = [
	"numpy>=1.24",
	"scipy>=1.10",
	"matplotlib>=3.7",
	"jupyter>=1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
